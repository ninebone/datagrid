<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>nine-table ::: cell-input-text</title>

    <link rel="stylesheet" href="css/example.css" />

    <script type="text/javascript" src="_data/example-data.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/util@latest/dist/nine-util.umd.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/datagrid@0.0.6/dist/nine-table.umd.js"></script>

    <script>
        nine.setup({
            debug: {
                enable: true,
                filter: ["nine-table"],
            },
            "nine-table": {
                //cssFile: "./css/nine-table/nine-table.css",
            },
        });
    </script>
</head>

<body>
    <h1>NineTable High-Performance Editable Grid & Cell Validation Showcase</h1>

    <nine-table show-footer="true">
        <table row-indicator="true">
            <colgroup>
                <col width="100"/>
                <col width="50"/>
                <col width="50"/>
                <col width="50"/>
                <col width="50"/>
                <col width="150"/>
                <col width="150"/>
                <col width="150"/>
                <col width="150"/>
                <col width="150"/>
                <col width="150"/>
            </colgroup>
            <thead>
            <tr>
                <th rowSpan="2">NAME</th>
                <th rowSpan="2">AGE</th>
                <th colSpan="3">text-align</th>
                <th colSpan="1" rowSpan="2">maxbyte=15</th>
                <th colSpan="3">validator</th>
                <th rowSpan="2">enable</th>
                <th rowSpan="2">visible</th>
            </tr>
            <tr>
                <th>left</th>
                <th>center</th>
                <th>right</th>
                <th>case #1 (expr)</th>
                <th>case #2 (expr)</th>
                <th>case #3 (with host)</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td data-bind="NAME"></td>
                <td data-bind="AGE"></td>
                <td data-bind="REC1" cell-type="input" text-align="left"></td>
                <td data-bind="REC2" cell-type="input" text-align="center"></td>
                <td data-bind="REC3" cell-type="input" text-align="right"></td>
                <td data-bind="NAME" cell-type="input" max-byte="15"></td>
                <td data-bind="NAME" cell-type="input" validator="!(nine.getByteLength(data.NAME) > 15)"></td>
                <td data-bind="NAME" cell-type="input" validator="!data.NAME.includes('i')"></td>
                <td data-bind="NAME" cell-type="input" validator="provider.checkName(data.NAME)"></td>
                <td data-bind="NAME" cell-type="input" enable="data.REC1 < 50 ? true : false"></td>
                <td data-bind="NAME" cell-type="input" visible="data.REC1 < 50"></td>
            </tr>
            </tbody>
        </table>
    </nine-table>

</body>

<script>

    const DATA_CNT = 100000;

    const grd = document.querySelector("nine-table");

    grd.provider.add({
        checkName: (v) => {
            return nine.getByteLength(v) > 15 ? false : true;
        },
    });

    grd.addEventListener("load", () => {
        grd.loading = true;
        setTimeout( () => {
            grd.data.set(exampleData.generateRandomData(DATA_CNT));
        });
    });

</script>

</html>
