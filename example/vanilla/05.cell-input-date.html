<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>nine-table ::: cell-input-date</title>

    <link rel="stylesheet" href="css/example.css" />

    <script type="text/javascript" src="_data/example-data.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/util@latest/dist/nine-util.umd.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/datagrid@latest/dist/nine-table.umd.js"></script>

    <script>
        nine.setup({
            debug: {
                enable: true,
                filter: ["nine-table"],
            },
            "nine-table": {
                cssFile: "./css/nine-table/_nine-table.css",
            },
        });
    </script>
</head>

<body>
    <h1>NineTable High-Performance Editable Grid & Cell Validation Showcase</h1>

    <nine-table show-footer="true">
        <table row-indicator="true">
            <colgroup>
                <col width="80"/>
                <col width="90"/>
                <col width="130"/>
                <col width="50"/>
                <col width="70"/>
                <col width="80"/>
                <col width="120"/>
                <col width="190"/>
                <col width="100"/>
                <col width="110"/>
                <col width="130"/>
                <col width="120"/>
            </colgroup>
            <thead>
            <tr>
                <th rowSpan="2">NAME</th>
                <th colSpan="5">SAMPLE DATA</th>
                <th colSpan="5">input-date</th>
                <th rowSpan="2">*</th>
            </tr>
            <tr>
                <th>Date</th>
                <th>Datetime</th>
                <th>Time</th>
                <th>Month</th>
                <th>Week</th>
                <th>date</th>
                <th>datetime-local</th>
                <th>time</th>
                <th>month</th>
                <th>week</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td data-bind="NAME"></td>
                <td data-bind="BIRTH_YMD"></td>
                <td data-bind="BIRTH_DT"></td>
                <td data-bind="T"></td>
                <td data-bind="M"></td>
                <td data-bind="W"></td>
                <td data-bind="BIRTH_YMD" cell-type="input-date"></td>
                <td data-bind="BIRTH_DT" cell-type="input-date" date-type="datetime-local"></td>
                <td data-bind="T" cell-type="input-date" date-type="time"></td>
                <td data-bind="M" cell-type="input-date" date-type="month"></td>
                <td data-bind="W" cell-type="input-date" date-type="week"></td>
                <td data-bind="BIRTH_YMD" cell-type="input-date"></td>
            </tr>
            </tbody>
        </table>
    </nine-table>

</body>

<script>

    const DATA_CNT = 100000;

    const grd = document.querySelector("nine-table");

    grd.addEventListener("load", () => {
        grd.loading = true;
        setTimeout( () => {
            grd.data.set(exampleData.generateRandomData(DATA_CNT));
        });
    });

</script>

</html>
