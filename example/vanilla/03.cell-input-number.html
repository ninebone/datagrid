<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>nine-table ::: cell-input-number</title>

    <link rel="stylesheet" href="css/example.css" />

    <script type="text/javascript" src="_data/example-data.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/util@latest/dist/nine-util.umd.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/datagrid@0.0.6/dist/nine-table.umd.js"></script>

    <script>
        nine.setup({
            debug: {
                enable: true,
                filter: ["nine-table"],
            },
            "nine-table": {
                //cssFile: "./css/nine-table/nine-table.css",
            },
        });
    </script>
</head>

<body>
    <h1>NineTable High-Performance Editable Grid & Cell Validation Showcase</h1>

    <nine-table show-footer="true">
        <table row-indicator="true">
            <colgroup>
                <col width="80"/>
                <col width="50"/>
                <col width="50"/>
                <col width="50"/>
                <col width="80"/>
                <col width="80"/>
                <col width="80"/>
                <col width="80"/>
                <col width="80"/>
                <col width="80"/>
                <col width="80"/>
                <col width="80"/>
            </colgroup>
            <thead>
            <tr>
                <th rowSpan="2">NAME</th>
                <th colSpan="3">SAMPLE DATA</th>
                <th colSpan="3">constraints & text-align</th>
                <th colSpan="3">validate</th>
                <th rowSpan="2">enable</th>
                <th rowSpan="2">visible</th>
            </tr>
            <tr>
                <th>REC1</th>
                <th>REC2</th>
                <th>REC3</th>
                <th>min=10</th>
                <th>max=90</th>
                <th>scale=2</th>
                <th>case #1</th>
                <th>case #2</th>
                <th>case #3</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td data-bind="NAME"></td>
                <td data-bind="REC1" cell-type="input-number" ></td>
                <td data-bind="REC2" cell-type="input-number" ></td>
                <td data-bind="REC3" cell-type="input-number" ></td>
                <td data-bind="REC1" cell-type="input-number" text-align="left" min="10"></td>
                <td data-bind="REC2" cell-type="input-number" text-align="center" max="90"></td>
                <td data-bind="REC3" cell-type="input-number" text-align="right" scale="2"></td>
                <td data-bind="REC1" cell-type="input-number" validator="data.REC1 < 50 ? true : false"></td>
                <td data-bind="REC2" cell-type="input-number" validator="data.REC2 < 50 ? true : false"></td>
                <td data-bind="REC3" cell-type="input-number" validator="provider.checkNum(data.REC1,data.REC2,data.REC3)"></td>
                <td data-bind="REC1" cell-type="input-number" enable="data.REC1 < 50 ? true : false"></td>
                <td data-bind="REC2" cell-type="input-number" visible="data.REC2 < 50"></td>
            </tr>
            </tbody>
        </table>
    </nine-table>

</body>

<script>

    const DATA_CNT = 100000;

    const grd = document.querySelector("nine-table");

    grd.provider.add({
        checkNum: (n1,n2,n3) => {
            return Number(n1) + Number(n2) + Number(n3) > 100 ? true : false;
        },
    });

    grd.addEventListener("load", () => {
        grd.loading = true;
        setTimeout( () => {
            grd.data.set(exampleData.generateRandomData(DATA_CNT));
        });
    });

</script>

</html>
