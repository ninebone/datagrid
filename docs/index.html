<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>nine-table ::: Overview</title>

    <script type="text/javascript" src="./data/example-data.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/util@latest/dist/nine-util.umd.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/table@latest/dist/nine-table.umd.js"></script>

    <script>
        nine.setup({
            debug: {
                enable: true,
                filter: ["nine-table"],
            },
            "nine-table": {
                //cssFile: "./css/nine-table/_nine-table.css",
            },
        });
    </script>
</head>

<body>
<h1>NineTable Overview Example</h1>

<nine-table show-footer="true">
    <table row-indicator="true">
        <colgroup>
            <col width="50" fixed="left"/>
            <col width="50" fixed="left"/>
            <col width="80"/>
            <col width="80"/>
            <col width="130"/>
            <col width="100"/>
            <col width="100"/>
            <col width="100"/>
            <col width="100"/>
            <col width="100"/>
            <col width="110"/>
            <col width="110"/>
            <col width="100"/>
        </colgroup>
        <thead>
        <tr>
            <th rowSpan="2" cell-type="checkbox"></th>
            <th rowSpan="2">Single<br/>Select</th>
            <th colSpan="3">Renderer</th>
            <th colSpan="3">Radio Button</th>
            <th colSpan="2">CheckBox</th>
            <th>input</th>
            <th>input color</th>
            <th rowSpan="2">custom chart</th>
        </tr>
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>Planning</th>
            <th>Development</th>
            <th>Design</th>
            <th>1</th>
            <th>2</th>
            <th colSpan="2">input date</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td data-bind="sel" rowSpan="2" cell-type="checkbox"></td>
            <td data-bind="sel2" rowSpan="2" cell-type="checkbox" is-radio="true"></td>
            <td data-bind="NAME" rowSpan="2" text-align="center" data-expr="host.renderImage(data.PIC)"
                html="true"></td>
            <td data-bind="NAME" rowSpan="2"></td>
            <td data-expr="'<font color=\'#999\'>' + data.REC1 + '+' + data.REC2 + '+' + data.REC3 + ' (Avg.<font color=\'green\'><b>' + Math.round((data.REC1 + data.REC2 + data.REC3) / 3) + '</b></font>)</font>'"
                html="true"></td>


            <td colSpan="3" cell-type="radio" data-bind="DEPART" data-source="host.getCommonCode('DEPART')"
                key-name="code" value-name="codename"></td>

            <td cell-type="checkbox" data-bind="SEX" true-value="M" false-value="F"></td>
            <td cell-type="checkbox" data-bind="SEX" text-align="right" true-value="M" false-value="F"
                true-text="Male" false-text="Female"></td>

            <td data-bind="NAME" cell-type="input" enable="data.REC1 > 30 ? true : false"></td>
            <td data-bind="COLOR2" cell-type="input-color" enable="data.REC1 > 30 ? true : false;"></td>

            <td rowSpan="2" data-expr="host.renderPieChart(data.REC1,data.REC2,data.REC3,data.REC4,data.REC5)" html="true"></td>
        </tr>
        <tr>
            <td data-expr="host.renderBadge(data.REC1,data.REC2,data.REC3)" html="true"></td>


            <td colSpan="3"
                data-expr="host.renderBarChart(data.REC1,data.REC2,data.REC3,data.REC4,data.REC5,data.REC6,data.REC7,data.REC8,data.REC9,data.REC10,data.REC11,data.REC12)"
                html="true"></td>

            <td data-expr="host.renderBadge2(data.REC2, 'red')" html="true"></td>
            <td data-expr="host.renderBadge2(data.REC3, 'olive')" html="true"></td>

            <td colSpan="2" data-bind="BIRTH_DT" cell-type="input-date" date-type="datetime-local"></td>
        </tr>
        </tbody>
    </table>
</nine-table>

</body>

<script>

    const DATA_CNT = 1000;

    const grd = document.querySelector("nine-table");

    grd.addEventListener("load", () => {

        grd.getCommonCode = (group) => {
            return exampleData.generateCommonCode(group);
        };

        grd.renderImage = (v) => {
            return `<img src="./${v}" style="vertical-align:middle; width:58px; height:58px; border-radius:50%;" />`;
        };

        grd.renderBadge = (v1,v2,v3) => {
            const v = (Number(v1) + Number(v2) + Number(v3)) / 3;

            if (v > 50) {
                return `<span style="display: block; width:${v}%; overflow:visible; padding: 0 4px; background: #d1e7dd; color: #0f5132;">High</span>`;
            } else {
                return `<span style="display: block; width:${v}%; overflow:visible; padding: 0 4px; background: #f8d7da; color: #842029;">Low</span>`;
            }
        };

        grd.renderBadge2 = (v, bg) => {
            return `
				<div style="display: flex; align-items: center; gap: 8px; width: 100%;">
					<span style="color: ${bg}; font-weight: 700; min-width: 16px; text-align: right;">${v}</span>
					<div style="flex: 1; background: #e2e8f0; height: 6px; border-radius: 3px; overflow: hidden;">
						<div style="width: ${v}%; height: 100%; background: ${bg};"></div>
					</div>
				</div>
			`;
        };

        grd.renderBarChart = (...values) => {
            const color = '#3b82f6';
            const width = 100;
            const height = 22; // 높이를 고정하여 셀 깨짐 방지

            if (!values || values.length === 0) return '';

            const points = values.map((v, index) => {
                const x = (index / (values.length - 1 || 1)) * width;
                const safeV = Math.min(Math.max(v, 0), 100);
                const y = height - (safeV / 100) * (height - 4) - 2;
                return { x, y };
            });

            let pathData = `M ${points[0].x} ${points[0].y}`;
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = points[i];
                const p1 = points[i + 1];
                const cpX = (p0.x + p1.x) / 2;
                pathData += ` C ${cpX} ${p0.y}, ${cpX} ${p1.y}, ${p1.x} ${p1.y}`;
            }

            const areaData = `${pathData} L ${width} ${height} L 0 ${height} Z`;

            return `
             <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 24px; padding: 0 4px;">
                 <svg viewBox="0 0 ${width} ${height}" style="width: 100%; height: 22px; overflow: visible;" preserveAspectRatio="none">
                     <path d="${areaData}" fill="${color}" opacity="0.15" />
                     <path d="${pathData}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" />
                 </svg>
             </div>
          `;
        };

        grd.renderPieChart = (...values) => {
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#6366f1', '#14b8a6', '#f97316', '#a855f7'];
            const size = 56; // 셀 높이에 알맞은 컴팩트한 사이즈
            const center = size / 2;
            const radius = center - 1;

            // 유효한 숫자로 변환 및 총합 계산
            const nums = values.map(v => Math.max(Number(v) || 0, 0));
            const total = nums.reduce((acc, cur) => acc + cur, 0);

            if (total === 0) {
                return `
                <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 24px;">
                   <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                      <circle cx="${center}" cy="${center}" r="${radius}" fill="#e2e8f0" />
                   </svg>
                </div>
             `;
            }

            let currentAngle = 0;
            const paths = nums.map((val, index) => {
                if (val === 0) return '';
                const sliceAngle = (val / total) * 360;
                const startAngle = currentAngle;
                const endAngle = currentAngle + sliceAngle;
                currentAngle = endAngle;

                const color = colors[index % colors.length];

                // 값이 하나뿐이거나 360도 꽉 찰 때
                if (sliceAngle >= 360) {
                    return `<circle cx="${center}" cy="${center}" r="${radius}" fill="${color}" />`;
                }

                const startRad = (startAngle - 90) * (Math.PI / 180);
                const endRad = (endAngle - 90) * (Math.PI / 180);

                const x1 = center + radius * Math.cos(startRad);
                const y1 = center + radius * Math.sin(startRad);
                const x2 = center + radius * Math.cos(endRad);
                const y2 = center + radius * Math.sin(endRad);

                const largeArcFlag = sliceAngle > 180 ? 1 : 0;

                // SVG Path (중앙 -> 시작점 -> 호 -> 끝점 -> 중앙 복귀)
                const pathData = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;

                return `<path d="${pathData}" fill="${color}" />`;
            }).join('');

            return `
             <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px;">
                <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                   <circle cx="${center}" cy="${center}" r="${radius}" fill="#e2e8f0" />
                   ${paths}
                </svg>
             </div>
          `;
        };


        grd.loading = true;
        setTimeout( () => {
            grd.data.set(exampleData.generateRandomData(DATA_CNT));
        });
    });

</script>

</html>
