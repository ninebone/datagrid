<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>nine-table ::: cell-input-color</title>

    <link rel="stylesheet" href="css/example.css" />

    <script type="text/javascript" src="_data/example-data.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/util@latest/dist/nine-util.umd.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@ninebone/table@latest/dist/nine-table.umd.js"></script>

    <script>
        nine.setup({
            debug: {
                enable: true,
                filter: ["nine-table"],
            },
            "nine-table": {
                cssFile: "./css/nine-table/_nine-table.css",
            },
        });
    </script>
</head>

<body>
    <h1>NineTable High-Performance Editable Grid & Cell Validation Showcase</h1>

    <nine-table show-footer="true">
        <table row-indicator="true">
            <colgroup>
                <col width="80"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
                <col width="100"/>
            </colgroup>
            <thead>
            <tr>
                <th rowSpan="2">NAME</th>
                <th colSpan="2">SAMPLE DATA</th>
                <th colSpan="3">COLOR1</th>
                <th colSpan="3">COLOR2</th>
                <th colSpan="2">data-source</th>
            </tr>
            <tr>
                <th>COLOR1</th>
                <th>COLOR2</th>
                <th>normal</th>
                <th>enable</th>
                <th>visible</th>
                <th>normal</th>
                <th>enable</th>
                <th>visible</th>
                <th>datalist</th>
                <th>data-source</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td data-bind="NAME"></td>
                <td data-bind="COLOR1" text-align="center"></td>
                <td data-bind="COLOR2" text-align="center"></td>
                <td data-bind="COLOR1" cell-type="input-color"></td>
                <td data-bind="COLOR1" cell-type="input-color"></td>
                <td data-bind="COLOR1" cell-type="input-color"></td>
                <td data-bind="COLOR2" cell-type="input-color"></td>
                <td data-bind="COLOR2" cell-type="input-color"></td>
                <td data-bind="COLOR2" cell-type="input-color"></td>
                <td data-bind="COLOR1" cell-type="input-color">
                    <datalist>
                        <option value="#00ff00"/>
                        <option value="#0000ff"/>
                    </datalist>
                </td>
                <td data-bind="COLOR2" cell-type="input-color" data-source="host.getColorList(data.REC1)"></td>
            </tr>
            </tbody>
        </table>
    </nine-table>

</body>

<script>

    const DATA_CNT = 100000;

    const grd = document.querySelector("nine-table");

    grd.addEventListener("load", () => {

        grd.getColorList = (v) => {
            const rawList = exampleData.generateCommonCode((v > 50) ? "COLOR" : "COLOR2");
            return rawList.map(item => ({
                ...item,
                value: item.code // code 값을 복사해서 value 속성 생성
            }));
        };

        grd.loading = true;
        setTimeout( () => {
            grd.data.set(exampleData.generateRandomData(DATA_CNT));
        });
    });

</script>

</html>
