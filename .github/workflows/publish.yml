name: Publish to npm & Update Docs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # 1.
      - name: Install dependencies
        run: npm ci

      # 2.
      - name: Build Core and Example for Docs
        run: npm run build:docs

      # 3.
      - name: Commit and push docs updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update example app and github pages preview"
          branch: main

      # 4.
      - name: Check version change
        id: check-version
        run: |
          if git diff HEAD^ HEAD -- package.json | grep -q '"+   "version":'; then
            echo "VERSION_CHANGED=true" >> $GITHUB_OUTPUT
            echo "Version has changed. Will publish to npm."
          else
            echo "VERSION_CHANGED=false" >> $GITHUB_OUTPUT
            echo "Version unchanged. Skipping npm publish."
          fi

      # 5.
      - name: Publish to npm
        if: steps.check-version.outputs.VERSION_CHANGED == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}