name: Publish to npm & Update Docs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 1. package.json의 version이 변경되었는지 확인
      - name: Check version change
        id: check-version
        run: |
          if git diff HEAD^ HEAD -- package.json | grep -q '"+   "version":'; then
            echo "VERSION_CHANGED=true" >> $GITHUB_OUTPUT
            echo "Version has changed. Will publish to npm."
          else
            echo "VERSION_CHANGED=false" >> $GITHUB_OUTPUT
            echo "Version unchanged. Skipping npm publish."
          fi

      # 2. 버전이 올라갔을 때만 서버에서 코어 빌드 후 npm 배포 실행
      - name: Build Core and Publish to npm
        if: steps.check-version.outputs.VERSION_CHANGED == 'true'
        run: |
          npm run build:core
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}