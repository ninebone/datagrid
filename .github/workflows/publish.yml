name: Publish to npm & Update Docs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check version change against npm registry
        id: check-version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          # npm에 등록된 최신 버전 조회 (존재하지 않으면 빈 문자열)
          PUBLISHED_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "")

          echo "Local version: $LOCAL_VERSION"
          echo "Published version: $PUBLISHED_VERSION"

          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "VERSION_CHANGED=true" >> $GITHUB_OUTPUT
            echo "New version detected. Will publish to npm."
          else
            echo "VERSION_CHANGED=false" >> $GITHUB_OUTPUT
            echo "Version already published. Skipping npm publish."
          fi

      # 2. 버전이 올라갔을 때만 서버에서 코어 빌드 후 npm 배포 실행
      - name: Build Core and Publish to npm
        if: steps.check-version.outputs.VERSION_CHANGED == 'true'
        run: |
          npm run build:core
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}