name: Publish to npm & Update Docs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # 1.
      - name: Install dependencies
        run: npm ci

      # 2.
      - name: Build Core and Example
        run: npm run build

      # 3.
      - name: Sync build to docs
        run: |
          rm -rf docs/*
          cp -r example/react/dist/* docs/

      # 4.
      - name: Commit and push docs updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: auto-build core & example, update docs [skip ci]"
          branch: main

      # 5.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}